# ARSMAG: этот workflow — модифицированная версия апстримного build.yml.
# Что именно изменено и почему — см. IZMENENIYA.md в корне репозитория и
# отчёт docs/reports/otchet-02-repozitorij-i-ci.md в проекте клиента.
# Коротко: оставлены только цели windows64 и windowslegacy64, добавлена
# проверка SHA-256 внешних бинарных загрузок (см. ZAVISIMOSTI.md),
# srslist.h закреплён на коммит вместо ветки, updater.exe исключён из
# финального пакета. Job публикации релиза возвращён в минимальном виде:
# создаёт prerelease с тегом ci-<номер запуска> и двумя архивами, чтобы
# сборку можно было забрать анонимно без доступа к вкладке Actions.
name: ArsLink build matrix
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: false
        default: "0.0.0-dev"
jobs:
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        # ARSMAG: матрица обрезана до windows64 и windowslegacy64 (было 9 целей).
        # windowslegacy runs the darwin host toolchain from go.zip; keep it on macOS.
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.26.5"
            runner: ubuntu-22.04
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.26.5"
            runner: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      # ARSMAG: SHA-256 патченого Go-тулчейна для Windows 7, см. ZAVISIMOSTI.md.
      GO_ZIP_SHA256: "47e0365adad30c8a35c9bc572a93575119ec3130217f57c81c6b1edd3e6dffc1"
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v4.3.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/server/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        shell: bash
        run: |
          curl -L -o go.zip https://github.com/throneproj/env_windows_legacy/releases/download/latest/go.zip
          echo "${GO_ZIP_SHA256}  go.zip" | sha256sum -c -
          7z x go.zip
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Clone cronet-go
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/parhelia512/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "9ed95366ae2f9b4b994cf54f8f9de0d8bc350057"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Download Chromium toolchain
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> $GITHUB_ENV
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArsLink-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
    needs:
      - build-go
    strategy:
      matrix:
        # ARSMAG: матрица обрезана до windows64 и windowslegacy64 (было 11 целей).
        include:
          - platform: windows-latest
            qt_version: "6.11.1"
            qt_sha256: "8d7271feca09092ec5f24eaaf1291bd52aa76ab57987fb7df2da0f259014c428"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
          - platform: windows-latest
            qt_version: "6.2.13"
            qt_sha256: "befecc7f607014a4b712b074a849a154e16038e26f01673db31c36a3029623d4"
            target: x64
            dest_suffix: windowslegacy-amd64
            common: windowslegacy-amd64
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      # ARSMAG: SHA-256 внешних загрузок, см. ZAVISIMOSTI.md. OpenSSL общий
      # для обеих целей (обе x64); Qt свой на цель — см. matrix.qt_sha256.
      OPENSSL_X64_SHA256: "0cc10ca8bd88a08f1f4275edf8c3f285c5988803e693d4dc8a12a85a9e544412"
      # srslist.h закреплён на коммит в throneproj/routeprofiles вместо ветки
      # rule-set — та живёт наездами (force-push поверх истории), см. ZAVISIMOSTI.md.
      SRSLIST_COMMIT: "e670939edad51a9381c4577b4c05c2a76d82a41f"
      SRSLIST_SHA256: "88b7c1af9a065deda6a8d590c1a4d75c02997d44f9164b238c9c88a247b37430"
      # ARSMAG: на push (не workflow_dispatch) github.event.inputs пуст —
      # подставляем номер запуска, чтобы сборка не падала без входа tag.
      INPUT_VERSION: ${{ github.event.inputs.tag || format('0.0.0-ci.{0}', github.run_number) }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      # Unquoted at the cmake call sites so it word-splits into two flags.
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v4.3.1
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ArsLink-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Qt Install
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        if: (!contains(matrix.platform, 'windows')) && matrix.qt_version != '6.2.0'
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.dest_suffix }}
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          echo "${{ matrix.qt_sha256 }}  qt.7z" | sha256sum -c -
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
          echo "${OPENSSL_X64_SHA256}  openssl.7z" | sha256sum -c -
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/${SRSLIST_COMMIT}/srslist.h"
          echo "${SRSLIST_SHA256}  srslist.h" | sha256sum -c -
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version != '6.2.0'
        run: |
          sudo apt update
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/${SRSLIST_COMMIT}/srslist.h"
          echo "${SRSLIST_SHA256}  srslist.h" | sha256sum -c -
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64.sh
      - name: Linux Using System Qt - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version == '6.2.0'
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-translations-l10n libglx-dev libgl1-mesa-dev
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/${SRSLIST_COMMIT}/srslist.h"
          echo "${SRSLIST_SHA256}  srslist.h" | sha256sum -c -
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64_system_qt.sh
      - name: macOS - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'macos' )
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/${SRSLIST_COMMIT}/srslist.h"
          echo "${SRSLIST_SHA256}  srslist.h" | sha256sum -c -
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_macos.sh
      # ========================================================================================================= Deployments
      - name: ARSMAG - Remove updater from package
        shell: bash
        run: |
          rm -fv "$DEST/updater.exe" "$DEST/updater" 2>/dev/null || true
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ArsLink-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  # ARSMAG: минимальная публикация — только чтобы ассеты релиза можно было
  # скачать анонимно (Actions-артефакты требуют авторизации, ассеты релиза
  # в публичном репозитории — нет). Не инсталлятор, не апстримный ghr-job:
  # просто два уже собранных архива под тегом-prerelease.
  publish-release:
    permissions:
      contents: write
    needs:
      - build-cpp
    runs-on: ubuntu-22.04
    steps:
      - name: Download windows64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ArsLink-${{ github.sha }}-windows-amd64
          path: download/windows64
      - name: Download windowslegacy64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ArsLink-${{ github.sha }}-windowslegacy-amd64
          path: download/windowslegacy64
      - name: Repack into release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar xzf download/windows64/artifacts.tgz -C download/windows64
          (cd download/windows64/deployment/windows-amd64 && zip -r "$GITHUB_WORKSPACE/release/windows64.zip" .)
          tar xzf download/windowslegacy64/artifacts.tgz -C download/windowslegacy64
          (cd download/windowslegacy64/deployment/windowslegacy-amd64 && zip -r "$GITHUB_WORKSPACE/release/windowslegacy64.zip" .)
      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "ci-${{ github.run_number }}" \
            release/windows64.zip release/windowslegacy64.zip \
            --repo "${{ github.repository }}" \
            --title "CI сборка #${{ github.run_number }}" \
            --prerelease \
            --notes "Автоматическая сборка по push в main, коммит ${{ github.sha }}. Не релиз для пользователей."
